name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          # See ci.yml: apt's rclone is far too old for the bisync flags this
          # project relies on (needs >= 1.74.0).
          curl https://rclone.org/install.sh | sudo bash

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # NixOS: dynamically linked, rpath-patched — for NixOS users and `nix run`
  build-nix:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        run: nix build .#onedrive

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp result/bin/onedrived      dist/onedrived-x86_64-linux-nix
          cp result/bin/onedrive-tui   dist/onedrive-tui-x86_64-linux-nix

      - uses: actions/upload-artifact@v4
        with:
          name: nix
          path: dist/

  # glibc dynamic: works on Debian, Fedora, Arch, etc.
  build-glibc:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p onedrived -p onedrive-tui

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/release/onedrived    dist/onedrived-x86_64-linux
          cp target/release/onedrive-tui dist/onedrive-tui-x86_64-linux

      - uses: actions/upload-artifact@v4
        with:
          name: glibc
          path: dist/

  # musl static: no dependencies, runs on any Linux. rusqlite's bundled
  # SQLite and fuser (talks to /dev/fuse directly, no libfuse) both build
  # against musl without extra native deps.
  build-musl:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Build (static)
        run: cargo build --release -p onedrived -p onedrive-tui --target x86_64-unknown-linux-musl

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/onedrived    dist/onedrived-x86_64-linux-musl
          cp target/x86_64-unknown-linux-musl/release/onedrive-tui dist/onedrive-tui-x86_64-linux-musl

      - uses: actions/upload-artifact@v4
        with:
          name: musl
          path: dist/

  release:
    needs: [build-nix, build-glibc, build-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: sha256sum dist/* | sed 's|dist/||' > dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
