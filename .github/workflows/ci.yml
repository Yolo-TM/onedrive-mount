name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Caching matters now that the workspace pulls in rusqlite's bundled
      # SQLite, which is a C build and the slowest thing here.
      - uses: Swatinem/rust-cache@v2

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          # Not `apt-get install rclone`: Ubuntu's package trails upstream by
          # over a decade of releases (1.60.1 on 24.04, as of this writing) —
          # found the hard way when every bisync-based test failed here with
          # an opaque "exited with status 1", because rclone 1.60 doesn't
          # know `--conflict-resolve`/`--conflict-loser`/`--recover`, added in
          # 1.74.0, and a flag-parse error prints before JSON logging exists
          # to capture. The install script always gets a current release.
          curl https://rclone.org/install.sh | sudo bash

      - name: Format
        run: cargo fmt --all -- --check

      # --all-targets so tests and benches are linted too, not just the libs.
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

      # Guards against the daemon and the CLI drifting apart on the control
      # protocol, and against the daemon refusing to start at all.
      - name: Smoke test the binaries
        run: |
          set -euo pipefail
          cargo build --workspace
          BIN="target/debug"

          # `Paths::from_env` follows the XDG base-dir spec correctly: an
          # `XDG_CONFIG_HOME` (etc.) already set in the environment wins over
          # `$HOME/.config` — that's the right behaviour for a real user, but
          # it means overriding only `HOME` here is not enough to isolate this
          # test from whatever the runner image happens to export. Found by
          # this step failing with "no config file" right after writing one:
          # the write and the read were landing in two different places.
          # Clear all of them so this is self-contained regardless.
          unset XDG_CONFIG_HOME XDG_STATE_HOME XDG_CACHE_HOME
          export HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"

          "$BIN/onedrive-rcd" --version
          "$BIN/onedrive-rc" --version
          "$BIN/onedrive-rcd" --print-unit | grep -q 'Type=notify'

          # No config yet: --check-config must fail cleanly with its own code.
          if "$BIN/onedrive-rcd" --check-config; then
            echo "expected --check-config to fail with no config present" >&2
            exit 1
          fi

          mkdir -p "$HOME/.config/onedrive-rc"
          cp config.example.toml "$HOME/.config/onedrive-rc/config.toml"
          "$BIN/onedrive-rcd" --check-config

          "$BIN/onedrive-rcd" &
          DAEMON=$!
          trap 'kill $DAEMON 2>/dev/null || true' EXIT

          # Wait for readiness via the control socket rather than a fixed sleep.
          for _ in $(seq 1 50); do
            if "$BIN/onedrive-rc" status --json >/dev/null 2>&1; then break; fi
            sleep 0.2
          done

          # Captured rather than piped straight into grep: `status --json`'s
          # own exit code is the overall health (0/1/2), not "did this call
          # succeed" — and the example config's remote has no real rclone
          # credentials, so the mount settles into a genuinely failed state
          # within this window, making exit 2 here expected, not a bug. Piped
          # under `pipefail` that killed the step before `log`/`doctor` ever
          # ran. Only the "did we actually reach the daemon" check below is
          # what this step is for.
          STATUS_JSON="$("$BIN/onedrive-rc" status --json || true)"
          echo "$STATUS_JSON"
          echo "$STATUS_JSON" | grep -q '"source": "daemon"'
          "$BIN/onedrive-rc" log -n 5
          # doctor exits 1 on warnings, which a CI box legitimately has.
          "$BIN/onedrive-rc" doctor || [ $? -le 1 ]

          # A second instance must refuse rather than racing the first.
          if "$BIN/onedrive-rcd"; then
            echo "expected a second daemon to be refused" >&2
            exit 1
          fi

          kill -TERM $DAEMON
          wait $DAEMON 2>/dev/null || true

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Evaluate the flake
        run: nix flake check --no-build
      - name: Build the daemon and CLI
        run: nix build .#onedrive-rc
