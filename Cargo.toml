[workspace]
members = ["crates/core", "crates/daemon", "crates/cli"]
resolver = "3"

[workspace.dependencies]
onedrive-core = { path = "crates/core" }

anyhow              = "1"
chrono              = { version = "0.4", features = ["serde"] }
clap                = { version = "4", features = ["derive", "wrap_help"] }
libc                = "0.2"
notify              = "8.2"
rusqlite            = { version = "0.37", features = ["bundled"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
tokio               = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
toml                = "1"
tracing             = "0.1"
tracing-appender    = "0.2"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json", "chrono"] }
# D-Bus for the sleep/resume/network/lock signals. `tokio` feature so it shares
# our runtime instead of starting an async-io one alongside it.
zbus                = { version = "5", default-features = false, features = ["tokio"] }
# Only for `Stream`; zbus returns streams and we need one adapter over them.
futures-core        = "0.3"
# Pure-Rust FUSE: talks to /dev/fuse via fusermount3 directly, no libfuse/
# pkg-config dependency — confirmed by building and mounting with it unmodified.
fuser               = "0.18.0"
# The TUI dashboard. No `serde`/async features: the dashboard polls the IPC
# client synchronously on a timer, same as every other CLI command.
ratatui             = "0.29"
crossterm           = "0.29"

tempfile            = "3"
filetime            = "0.2"
